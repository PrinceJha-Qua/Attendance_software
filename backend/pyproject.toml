[project]
name = "gatekeeper-backend"
version = "1.0.0rc1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "pyjwt>=2.8",
    "argon2-cffi>=23",
    "python-multipart>=0.0.9",
    "cryptography>=43",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "fakeredis>=2.23", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
